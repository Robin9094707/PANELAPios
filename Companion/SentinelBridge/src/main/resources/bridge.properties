# Must match plugins/SimplexAdminSuite/config.yml -> alt-detection.bridge
host=127.0.0.1
port=39092
path=/v1/session
heartbeat-path=/v1/heartbeat
shared-secret=CHANGE-ME
connect-timeout-ms=1500
read-timeout-ms=2000
retry-count=3
# Raw identifiers would be written to disk when enabled. It is disabled by default.
spool-failed-payloads=false

# Additional diagnostics. Existing shared-secret and endpoint are preserved on upgrade.
scheme=http
diagnostics.enabled=true
diagnostics.cosmetics=true
diagnostics.party=false
diagnostics.misc=true
diagnostics.session-refresh=true
session-refresh-seconds=120
outbox-max-files=500
outbox-max-age-hours=24
outbox-max-mib=8
