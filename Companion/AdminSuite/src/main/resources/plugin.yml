  simplexadminsuite.vpn.admin:
    description: Vollzugriff auf den integrierten VPN-/Proxy-Schutz.
    default: op
    children:
      simplexadminsuite.vpn.view: true
      simplexadminsuite.vpn.manage: true
      simplexadminsuite.vpn.whitelist: true
      simplexadminsuite.vpn.check: true
      simplexadminsuite.vpn.logs: true
  simplexadminsuite.vpn.view:
    description: Darf VPN-Status sowie Java-/Bedrock-Menüs ansehen.
    default: op
  simplexadminsuite.vpn.manage:
    description: Darf Schutz, Provider, Cache und Discord-Protokollkanal verwalten.
    default: op
  simplexadminsuite.vpn.whitelist:
    description: Darf gespeicherte Spieler UUID-sicher zur VPN-Whitelist hinzufügen oder entfernen.
    default: op
  simplexadminsuite.vpn.check:
    description: Darf IP-Adressen manuell über die aktiven VPN-Provider prüfen.
    default: op
  simplexadminsuite.vpn.logs:
    description: Darf das lokale VPN-Erkennungsprotokoll einsehen.
    default: op

  # Kompatibilitätsrechte für bisherige SimplexVPNBlocker-Setups. Es existiert bewusst kein Bypass-Recht.
  simplexvpn.admin:
    description: Legacy-Vollzugriff auf die integrierte VPN-Verwaltung.
    default: op
    children:
      simplexvpn.status: true
      simplexvpn.reload: true
      simplexvpn.whitelist: true
      simplexvpn.check: true
  simplexvpn.status:
    description: Legacy-Recht für VPN-Status und Protokoll.
    default: op
  simplexvpn.reload:
    description: Legacy-Recht zum Neuladen der VPN-Einstellungen.
    default: op
  simplexvpn.whitelist:
    description: Legacy-Recht zur Verwaltung der VPN-Whitelist.
    default: op
  simplexvpn.check:
    description: Legacy-Recht für manuelle VPN-IP-Prüfungen.
    default: op

