    description: Darf Java-Kanalerfassung und die von Alt-Erkennung getrennte Client-Signaturdiagnose verwalten.
    default: op
  simplexadminsuite.clientsecurity.alerts:
    description: Empfängt interne Benachrichtigungen über erkannte oder blockierte Java-Clients.
    default: op
