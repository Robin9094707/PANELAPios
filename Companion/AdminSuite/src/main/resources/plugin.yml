name: SimplexAdminSuite
main: eu.simplexsmp.adminsuite.SimplexAdminSuite
version: 9.2.0
api-version: '26.2'
author: RJ
website: https://simplexsmp.eu
description: Crossplay-Admin-Suite mit Spielerprofilen, Moderation und Befehlsverwaltung.
softdepend:
  - BlueMap
  - floodgate
  - Geyser-Spigot
  - LiteBans
  - Lands
  - ProVanish
  - Vanish
  - SimpleVanish
  - PremiumVanish
  - SuperVanish
  - InvSeePlusPlus
  - InvSee++
  - InvSee
  - SimplexHomes
  - LuckPerms
  - SimplexTrimmer
commands:
  checkhacks:
    description: Java client translation/keybind probes; no CheckHacks plugin required.
    aliases: [sascheckhacks, clientcheck]
    usage: /checkhacks <player> [all|mod1,mod2|status|stop]
    permission: simplexadminsuite.clientcheck
  checklang:
    description: Shows the locale reported by the client, not proof of language.
    usage: /checklang <player>
    permission: simplexadminsuite.clientcheck
  chalerts:
    description: Toggles client probe alerts for this staff session.
    permission: simplexadminsuite.clientcheck.alerts
  chreload:
    description: Reloads client probe definitions.
    permission: simplexadminsuite.clientsecurity.admin
  shop:
    description: Opens the points / item-payment shop with native crossplay menus.
    usage: /shop [admin]
  delivery:
    description: Read and acknowledge your staff messages.
    usage: /delivery [inbox|ack id|admin|status player|create player chat/menu priority title | message]
    aliases: [quickdelivery, teammessages]
  spcurrency:
    description: Points API command bridge for trusted plugins and scripts.
    usage: /spcurrency <balance|deposit|withdraw|set> <player> [amount] [reason]
    permission: simplexadminsuite.points.admin
  connection:
    description: Admin connection diagnostics, sampled Java ping and disconnect history.
    usage: /connection <player> [status|test|history] [page]
    aliases: [sasconnection, connectioncheck]
    permission: simplexadminsuite.connection
  simplexprofile:
    description: Your profile, statistics, language, feedback and sidebar settings.
    aliases: [profile, profil, simplexprofil, settings, einstellungen]
    usage: /profil [settings|history|stats|feedback]
  feedback:
    description: Send feedback to the server team or read replies.
    usage: /feedback [message]
  link:
    description: Link your Minecraft account to Discord.
    usage: /link [code|status|unlink]
  unlink:
    description: Unlink your Discord account with confirmation.
    usage: /unlink
  checkban:
    description: Prüft LiteBans, interne und Minecraft-Bans.
    usage: /checkban <Spieler oder UUID>
    aliases: [sascheckban]
  checkmute:
    description: Prüft LiteBans und interne Mutes.
    usage: /checkmute <Spieler oder UUID>
    aliases: [sascheckmute]
  xraybait:
    description: Temporäre clientseitige Diamant-Köder, ohne Weltänderung.
    usage: /xraybait <Spieler> [5-60] [wenig|viele] oder /xraybait stop [Spieler]
  discord:
    description: Öffnet die Discord-Einladung.
    usage: /discord [Einladungscode oder Link]
  setdiscord:
    description: Ändert den öffentlichen Discord-Einladungslink.
    usage: /setdiscord <Einladungscode oder Link>
  vanish:
    description: Integrierter Admin-Vanish mit Flugmodus.
    usage: /vanish
  simplexadmin:
    description: Öffnet die Simplex Admin Suite.
    usage: /simplexadmin [menu|connection|adminupdate|adminrights|watch|vpn|activity|scoreboard|playerdata|ai|fun|power|qol|worlds|trimmer|warps|rules|polls|points|channels|clientsecurity|discordstatus|alts|operations|nickname|help]
    aliases: [adminsuite, adminmenu, admin, suite]
  sas:
    description: Kurzcommand für die Simplex Admin Suite.
    usage: /sas [menu|connection|adminupdate|adminrights|watch|vpn|activity|scoreboard|playerdata|ai|fun|power|qol|worlds|trimmer|warps|rules|polls|points|channels|clientsecurity|discordstatus|alts|operations|nickname|help]
    aliases: [sa]
  report:
    description: Report a player through the matching Java or Bedrock menu.
    usage: /report
    permission: simplexadminsuite.report
  reports:
    description: Öffnet die interne Report-Zentrale für Staff.
    usage: /reports
    permission: simplexadminsuite.reports
  staff:
    description: Öffnet den internen Staff-Arbeitsbereich.
    usage: /staff
    permission: simplexadminsuite.admin
  staffmsg:
    description: Sendet eine interne Nachricht an das Staff-Team.
    usage: /staffmsg <Nachricht>
    aliases: [staffchat, sc]
    permission: simplexadminsuite.staffchat
  warps:
    description: Opens the public server warp menu or teleports to a named warp.
    usage: /warps [warp]
    aliases: [serverwarps]
    permission: simplexadminsuite.warps.use
  rules:
    description: Opens the current server rules and required acceptance menu.
    usage: /rules
    permission: simplexadminsuite.rules.use
  vote:
    description: Opens the currently active server vote.
    usage: /vote
    aliases: [poll]
    permission: simplexadminsuite.polls.use
  points:
    description: Shows your Simplex Points, rank, or leaderboard.
    usage: /points [top]
    aliases: [simplexpoints, spoints]
    permission: simplexadminsuite.points.use
  trimworld:
    description: Öffnet den integrierten Welten-Trimmer für echte Server-Operatoren.
    usage: /trimworld
    aliases: [trimmer, weltentrimmer]
  fart:
    description: Let everyone know that your player farted.
    usage: /fart [tiny|light|bubbly|medium|wet|long|trumpet|thunder|ultra|nuclear|random|toggle]
    aliases: [toot]
    permission: simplexadminsuite.fart.use
  burp:
    description: Let everyone know that your player burped.
    usage: /burp [small|loud|deep|monster|random|toggle]
    aliases: [belch]
    permission: simplexadminsuite.burp.use
  ask:
    description: Ask the optional Simplex server assistant a contextual question.
    usage: /ask <question>
    permission: simplexadminsuite.ai.ask
  aiadmin:
    description: Verwaltet optionale OpenAI-Funktionen und bestätigungspflichtige KI-Vorschläge.
    usage: /aiadmin [status|test|propose <Anweisung>|confirm <ID>|limit <Spieler> <Anzahl>]
    permission: simplexadminsuite.ai.admin
  aiconfirm:
    description: Öffnet den accountgebundenen Bestätigungsdialog für einen KI-Vorschlag.
    usage: /aiconfirm <ID>
    permission: simplexadminsuite.ai.admin
  scoreboard:
    description: Shows scoreboard information or opens the admin scoreboard editor.
    usage: /scoreboard [toggle|reset|title <Text>]
    aliases: [sidebar, sb]
  setdays:
    description: Setzt die Ingame-Tage der Hauptweltgruppe.
    usage: /setdays <Tage>
    permission: simplexadminsuite.scoreboard.admin
  setvanilladays:
    description: Setzt die Ingame-Tage der optionalen Zweitweltgruppe.
    usage: /setvanilladays <Tage>
    aliases: [setdays2]
    permission: simplexadminsuite.scoreboard.admin
  sbreset:
    description: Baut das native Scoreboard für alle Spieler neu auf.
    usage: /sbreset
    permission: simplexadminsuite.scoreboard.admin
  playerdata:
    description: Öffnet persistente Online-/24-Stunden-Spielerdaten inklusive NBT und Statistiken.
    usage: /playerdata [Spieler]
    aliases: [pdata, recentplayers]
    permission: simplexadminsuite.playerdata
  nickname:
    description: Setzt oder entfernt einen rein visuellen Spielernickname.
    usage: /nickname <Spieler> <Nickname|reset>
    aliases: [nick, spitzname]
    permission: simplexadminsuite.nickname
  simplexvpn:
    description: Verwaltet den integrierten VPN-/Proxy-Schutz, die Whitelist und das Protokoll.
    usage: /simplexvpn [menu|status|an|aus|neu-laden|whitelist|spieler|prüfen|protokoll|cache]
    aliases: [svpn]
permissions:
  simplexadminsuite.bluemap:
    description: Manage persistent BlueMap visibility.
    default: op
  simplexadminsuite.bluemap.hidden:
    description: Always hide this player from BlueMap; grant explicitly.
    default: false
  simplexadminsuite.clientcheck:
    description: Start and inspect Java client probes.
    default: op
  simplexadminsuite.clientcheck.alerts:
    description: Receive client probe results.
    default: op
  simplexadminsuite.shop.use:
    default: true
  simplexadminsuite.shop.admin:
    default: op
  simplexadminsuite.delivery.admin:
    default: op
  simplexadminsuite.connection:
    description: Inspect connection diagnostics and retained disconnect reasons.
    default: op
  simplexadminsuite.commands.admin:
    description: Spielerbefehle sperren und Befehlsvorschläge bereinigen.
    default: op
  simplexadminsuite.community.admin:
    description: Feedback, profile history and bilingual expiring announcements.
    default: op
  simplexadminsuite.playerdata.edit:
    default: op
    description: Hunger, Sättigung, Gesundheit und XP online ändern.
  simplexadminsuite.xraybait:
    description: Temporäre X-Ray-Beobachtung mit Fake-Blöcken.
    default: op
  simplexadminsuite.*:
    description: Alle Rechte der Simplex Admin Suite.
    default: op
