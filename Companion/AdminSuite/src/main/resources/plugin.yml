    description: Darf Aktivitätsintelligenz, AFK-Qualität und Punkte-Schwellen verwalten.
    default: op
  simplexadminsuite.scoreboard.admin:
    description: Darf Scoreboard, Weltgruppen und Ingame-Tage verwalten.
    default: op
  simplexadminsuite.playerdata:
    description: Darf Online-/24-Stunden-Profile, NBT, Vanilla-Statistiken und Punktekonten ansehen.
    default: op
  simplexadminsuite.ai.ask:
    description: Allows players to use the optional, rate-limited /ask server assistant.
    default: true
  simplexadminsuite.ai.admin:
    description: Darf optionale OpenAI-Funktionen, Limits und bestätigungspflichtige KI-Vorschläge verwalten.
    default: op
  simplexadminsuite.ai.unlimited:
    description: Umgeht das tägliche /ask-Nutzungslimit.
    default: op

  simplexadminsuite.fun.admin:
    description: Darf Fun- und Community-Funktionen, Effekte, Cooldowns und Statistiken verwalten.
    default: op
  simplexadminsuite.fart.use:
    description: Allows players to use /fart once per configured cooldown.
