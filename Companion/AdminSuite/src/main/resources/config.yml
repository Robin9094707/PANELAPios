alt-detection:
  enabled: true
  # Strict correlation policy since 7.2.0: automatic Alt relations use only exact shared IP history
  # and verified Bedrock device/XUID/self-signed identities. Java brand, protocol, locale, registered
  # plugin channels, inferred mods, Bedrock model/OS and client-random IDs never create or score an edge.
  # Manual links remain possible because they are an explicit staff decision.
  analysis:
    # Die Übersicht wird asynchron aufgebaut. Eine alte gemeinsame IP bleibt als forensische Kante
    # erhalten; nur direkte Treffer ab diesem Score werden ohne Deep-Link-Hinweis angezeigt.
    minimum-display-score: 25
    # Begrenzter Cache pro Profil; 100 deckt Menüs und Ultrabann-Verknüpfungen vollständig ab.
    max-cached-matches-per-profile: 100
  cascade:
    # A shared IP by itself never qualifies for automatic cascade punishment.
    minimum-score: 70
  bridge:
    # Local HMAC-authenticated channel used by SimplexSentinelBridge in Geyser/extensions.
    enabled: true
    bind: '127.0.0.1'
    port: 39092
    allow-non-loopback: false
    max-payload-bytes: 32768
    max-clock-skew-seconds: 180
    shared-secret: 'CHANGE-ME'
  ultraban:
    # Explicit identity-wide ban. Unlike normal cascade punishment, this intentionally includes
    # the current exact IP and can therefore also affect family/shared-network accounts.
    enabled: true
    include-current-ip: true
    include-ip-history-days: 14
    # true ignoriert das darunterliegende Sicherheitslimit und nimmt alle bereits bekannten
    # Konten mit passender aktueller/junger IP auf. Wegen gemeinsam genutzter Anschlüsse bewusst
    # nur für den ausdrücklich ausgelösten Ultrabann aktivieren.
    include-all-known-ip-linked-accounts: true
    max-ip-linked-accounts: 100
    # Standardmäßig übernehmen auch nur über IP gefundene Konten ihre bekannten und später neu
    # erkannten Geräte-/XUID-/Self-Signed-IDs in dieselbe Ultrabann-Gruppe.
    absorb-identities-from-ip-linked-accounts: true
    include-client-random-id: false
    alert-online-staff: true
    alert-known-reconnects: false
    max-evasion-events: 1000
    event-retention-days: 180
  identity-bans:
    # Device/XUID/self-signed identities are safe defaults. Exact IP bans are disabled because
    # families, mobile networks, VPN exits and carrier NAT can legitimately share addresses.
    include-ip: false
    include-client-random-id: false
    # Wird ein künftiges Konto/Gerät über eine bestehende Identitätssperre erkannt, werden seine
    # UUID und weiteren Geräteanker derselben Sperre hinzugefügt. Beim Entbannen der Quelle werden
    # diese abgeleiteten Anker gemeinsam entfernt.
    expand-identities-on-match: true
    expand-identities-from-ip-match: true
  messages:
    # English defaults with DE/EN delivery.
    identity-ban: |-
      You are banned from this server.
      Reason: {reason}
      Remaining: {remaining}
    ultra-ban: |-
      You are permanently blocked by an identity-wide ban.
      Reason: {reason}
      Reference: {group}
    device-blocked: |-
      This device has been blocked.
      Contact the server staff if you believe this is a mistake.
    ip-blocked: |-
      This network address has been blocked.
      Contact the server staff if you believe this is a mistake.

