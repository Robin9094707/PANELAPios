name: Build and test unsigned iOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: iOS build, simulator tests and unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse verified tests only for identical app source
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validation.py
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show SDK and install XcodeGen
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick iPhone simulator
        if: steps.validation.outputs.reuse != 'true'
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in sorted(d["devices"].items(),reverse=True) if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Compile app and simulator tests
        if: steps.validation.outputs.reuse != 'true'
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Panel.xcodeproj -scheme Panel -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS=Config/Simulator.entitlements | tee simulator-build.log
      - name: Boot simulator
        if: steps.validation.outputs.reuse != 'true'
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.id }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
          xcrun simctl status_bar '${{ steps.simulator.outputs.id }}' override --time '9:41' --batteryState charged --batteryLevel 100
      - name: Start synthetic pinned TLS fixture
        if: steps.validation.outputs.reuse != 'true'
        run: |
          nohup python3 scripts/suite_tls_fixture.py </dev/null > build/tls-fixture.log 2>&1 &
          fixture_pid=$!
          for attempt in {1..40}; do
            if ! kill -0 "$fixture_pid" 2>/dev/null; then cat build/tls-fixture.log; exit 1; fi
            if curl -k -f -s --connect-timeout 1 --max-time 3 -H 'Authorization: Bearer synthetic-tls-token' https://127.0.0.1:49383/v1/health > build/tls-health.json; then exit 0; fi
            sleep 1
          done
          cat build/tls-fixture.log
          echo "Synthetic TLS fixture failed its bounded readiness check"
          exit 1
      - name: Test on simulator
        if: steps.validation.outputs.reuse != 'true'
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Panel.xcodeproj -scheme Panel -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult -parallel-testing-enabled NO -only-testing:PanelTests/Panel230Tests -only-testing:PanelTests/WorkspaceUpdateTests -only-testing:PanelTests/UpdateFixTests -only-testing:PanelTests/AddonUpdateTests -only-testing:PanelTests/MarketplaceNetworkTests -only-testing:PanelTests/AdminSuiteTests -only-testing:PanelTests/ConsoleStatisticsTests -only-testing:PanelTests/WidgetMetricsTests -only-testing:PanelTests/PlayerPermissionFixTests -only-testing:PanelTests/AMPTests -only-testing:PanelTests/PluginDetailsTests -only-testing:PanelTests/PanelTests -only-testing:PanelUITests/PanelUITests/testSuiteOperationsStructuredTelemetry -only-testing:PanelUITests/PanelUITests/testDemoDashboardConsoleFilesBackupsAndManagement -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 360 | tee simulator.log
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild build -project Panel.xcodeproj -scheme Panel -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' | tee device.log
      - name: Package and verify IPA
        run: |
          mkdir -p build/export/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Panel.app build/export/Payload/
          test -f build/export/Payload/Panel.app/PlugIns/PanelWidgets.appex/PanelWidgets
          test -f build/export/Payload/Panel.app/Panel
          test ! -d build/export/Payload/Panel.app/_CodeSignature
          xcrun lipo build/export/Payload/Panel.app/Panel -verify_arch arm64
          plutil -lint build/export/Payload/Panel.app/Info.plist
          cd build/export
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/Panel.app/Info.plist)
          IPA_FILENAME="Simplex-Panel-${IPA_VERSION}-unsigned.ipa"
          zip -qry "$IPA_FILENAME" Payload
          unzip -t "$IPA_FILENAME"
          shasum -a 256 "$IPA_FILENAME" > SHA256SUMS.txt
      - name: Extract UI test screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/Tests.xcresult ]; then xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots || true; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Panel-unsigned-IPA
          path: |
            build/export/*-unsigned.ipa
            build/export/SHA256SUMS.txt
            build/validation-proof.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: |
            build/Tests.xcresult
            build/screenshots
            simulator.log
            simulator-build.log
            device.log
          retention-days: 14

  companion:
    name: Admin Suite JAR, HTTPS and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: inspector_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: Companion/AdminSuite/target/build-deps
          key: suite-build-deps-${{ hashFiles('Companion/AdminSuite/tools/build-dependencies.json') }}
      - name: Build with verified real Paper dependencies
        working-directory: Companion/AdminSuite
        run: python3 tools/build-real.py
      - name: Check HTTPS authentication, confirmations and existing data
        working-directory: Companion/AdminSuite
        run: python3 tools/test-830.py
        env:
          TEST_DATABASE: "1"
      - name: Package companion source and checksums
        working-directory: Companion/AdminSuite
        run: |
          python3 tools/package-source.py
          cd target
          sha256sum SimplexAdminSuite-8.5.0.jar SimplexAdminSuite-8.5.0-source.zip > AdminSuite-SHA256SUMS.txt
      - name: Upload companion plugin
        uses: actions/upload-artifact@v4
        with:
          name: SimplexAdminSuite-unsigned-plugin
          path: |
            Companion/AdminSuite/target/SimplexAdminSuite-8.5.0.jar
            Companion/AdminSuite/target/SimplexAdminSuite-8.5.0-source.zip
            Companion/AdminSuite/target/AdminSuite-SHA256SUMS.txt
          if-no-files-found: error


  release:
    name: Publish verified app update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, companion]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Panel-unsigned-IPA
          path: build/release
      - uses: actions/download-artifact@v4
        with:
          name: SimplexAdminSuite-unsigned-plugin
          path: build/companion
      - name: Publish versioned IPA and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          ipa_files=(build/release/**/*-unsigned.ipa)
          test "${#ipa_files[@]}" -eq 1
          test -f "${ipa_files[0]}"
          ipa_name=$(basename "${ipa_files[0]}")
          ipa_version=${ipa_name#Simplex-Panel-}
          ipa_version=${ipa_version%-unsigned.ipa}
          [[ "$ipa_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ipa_directory=$(dirname "${ipa_files[0]}")
          (cd "$ipa_directory" && shasum -a 256 -c SHA256SUMS.txt)
          tag="app-v${ipa_version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This app version already has a release; increment the version before replacing it."
            exit 1
          fi
          cat > build/release/RELEASE-NOTES.md <<'NOTES'
          Simplex Panel 2.3.0 fixes directory-aware upload signing, stages and verifies JARs before activation, and repairs the first Files-picker handoff for plugin and mod updates. A raw-body transfer fallback is reconciled by SHA-256 before moving files.

          Java worlds gain a bounded read-only file/region/playerdata storage scan and level.dat information. New optional Minecraft, storage and transfer cards, color presets, card radius/tint/density and a wide-screen workspace grid expand customization without resetting saved layouts.

          Admin Suite 8.5.0 adds a full-key-only database metadata scanner. It uses fixed metadata queries, a read-only SQL transaction, bounded timeouts and one concurrent connection. Panel passwords are tried first; optional overrides stay in the device Keychain. Table sizes and estimated rows are shown; provider quotas are not invented. TLS is verified by default, with an explicit plaintext database option for compatible private hosts. Existing Suite storage and API keys remain compatible.

          Install over the existing app using the same signing identity and bundle ID. For the database scanner, update the companion JAR and restart Minecraft; prior Suite functionality remains available. Real Kinetic uploads and your database credentials still require device validation.
          NOTES
          (cd build/companion && sha256sum -c AdminSuite-SHA256SUMS.txt)
          gh release create "$tag" build/companion/*.jar build/companion/*-source.zip build/companion/AdminSuite-SHA256SUMS.txt "${ipa_files[0]}" "$ipa_directory/SHA256SUMS.txt" build/release/validation-proof.json --target "$GITHUB_SHA" --title "Simplex Panel ${ipa_version}" --notes-file build/release/RELEASE-NOTES.md --latest

