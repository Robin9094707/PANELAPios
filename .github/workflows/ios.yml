name: Build and test unsigned iOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: iOS build, simulator tests and unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse verified tests only for identical app source
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validation.py
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show SDK and install XcodeGen
        run: |
          xcodebuild -version
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild build -project Panel.xcodeproj -scheme Panel -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' | tee device.log
      - name: Package and verify IPA
        run: |
          mkdir -p build/export/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Panel.app build/export/Payload/
          test -f build/export/Payload/Panel.app/PlugIns/PanelWidgets.appex/PanelWidgets
          test -f build/export/Payload/Panel.app/Panel
          test ! -d build/export/Payload/Panel.app/_CodeSignature
          xcrun lipo build/export/Payload/Panel.app/Panel -verify_arch arm64
          plutil -lint build/export/Payload/Panel.app/Info.plist
          cd build/export
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/Panel.app/Info.plist)
          IPA_FILENAME="Simplex-Panel-${IPA_VERSION}-unsigned.ipa"
          zip -qry "$IPA_FILENAME" Payload
          unzip -t "$IPA_FILENAME"
          shasum -a 256 "$IPA_FILENAME" > SHA256SUMS.txt
      - name: Upload the IPA as an individual file
        uses: actions/upload-artifact@v7.0.2
        with:
          path: build/export/*-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Pick iPhone simulator
        if: steps.validation.outputs.reuse != 'true'
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in sorted(d["devices"].items(),reverse=True) if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Compile app and simulator tests
        if: steps.validation.outputs.reuse != 'true'
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Panel.xcodeproj -scheme Panel -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/simulator ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS=Config/Simulator.entitlements | tee simulator-build.log
      - name: Boot simulator
        if: steps.validation.outputs.reuse != 'true'
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.id }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
      - name: Test on simulator
        if: steps.validation.outputs.reuse != 'true'
        run: |
          set -o pipefail
          python3 scripts/suite_tls_fixture.py > build/tls-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          # Focused regression checks, a real pinned TLS fixture and three short UI navigation checks.
          xcodebuild test-without-building -project Panel.xcodeproj -scheme Panel -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult -parallel-testing-enabled NO -only-testing:PanelTests/Panel400Tests -only-testing:PanelTests/Panel410Tests -only-testing:PanelTests/Panel420Tests -only-testing:PanelTests/Panel430Tests -only-testing:PanelTests/Panel440Tests -only-testing:PanelTests/Panel450Tests -only-testing:PanelTests/Panel460Tests -only-testing:PanelTests/Panel480Tests -only-testing:PanelTests/Panel490Tests -only-testing:PanelTests/Panel491Tests -only-testing:PanelTests/Panel560Tests -only-testing:PanelTests/Panel570Tests -only-testing:PanelTests/Panel580Tests -only-testing:PanelTests/Panel590Tests -only-testing:PanelTests/Panel5100Tests -only-testing:PanelTests/PinnedHTTPTests -only-testing:PanelUITests/PanelUITests/test490HomeShortcutsAndHelpLaunch -only-testing:PanelUITests/PanelUITests/test491SpecificServerShortcutsAndSelectablePicker -only-testing:PanelUITests/PanelUITests/test491FailedServerCanRetryWithoutBlockingOtherServers -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 | tee simulator.log
      - name: Extract UI test screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/Tests.xcresult ]; then xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots || true; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Panel-unsigned-IPA
          path: |
            build/export/*-unsigned.ipa
            build/export/SHA256SUMS.txt
            build/validation-proof.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: |
            build/Tests.xcresult
            build/screenshots
            simulator.log
            simulator-build.log
            device.log
          retention-days: 14

  companion:
    name: Admin Suite JAR, HTTPS and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: inspector_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: Companion/AdminSuite/target/build-deps
          key: suite-build-deps-${{ hashFiles('Companion/AdminSuite/tools/build-dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: Companion/SentinelBridge/target/build-deps
          key: bridge-build-deps-${{ hashFiles('Companion/SentinelBridge/tools/build-dependencies.json') }}
      - name: Build with verified real Paper dependencies
        working-directory: Companion/AdminSuite
        run: python3 tools/build-real.py
      - name: Upload the JAR as an individual file
        uses: actions/upload-artifact@v7.0.2
        with:
          path: Companion/AdminSuite/target/SimplexAdminSuite-10.18.0.jar
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Check HTTPS authentication, accounts, push, admin-log filters, recovery, LuckPerms/Lands, access locks, command rights, diagnostics, world trimmer, studio designers, dossier, Werbe-Zentrale (ad hub), web panel and existing data
        working-directory: Companion/AdminSuite
        run: python3 tools/test-830.py
        env:
          TEST_DATABASE: "1"
      - name: Package companion source and checksums
        working-directory: Companion/AdminSuite
        run: |
          python3 tools/package-source.py
          cp ../../docs/Simplex-Admin-Recovery.pdf target/
          cd target
          sha256sum SimplexAdminSuite-10.18.0.jar SimplexAdminSuite-10.18.0-source.zip Simplex-Admin-Recovery.pdf > AdminSuite-SHA256SUMS.txt
      - name: Build and test SimplexSentinelBridge (Geyser extension) against the real Geyser API
        working-directory: Companion/SentinelBridge
        run: |
          python3 tools/build-real.py
          python3 tools/test-real.py
          bash tools/run-bridge-test.sh
          zip -qr target/SimplexSentinelBridge-1.6.0-source.zip src stubs tools README.md CHANGELOG.md BUILDING.md INSTALLATION-ALT-DETECTION.md
          cd target && sha256sum SimplexSentinelBridge-1.6.0.jar SimplexSentinelBridge-1.6.0-source.zip > SentinelBridge-SHA256SUMS.txt
      - name: Upload companion plugin
        uses: actions/upload-artifact@v4
        with:
          name: SimplexAdminSuite-unsigned-plugin
          path: |
            Companion/AdminSuite/target/SimplexAdminSuite-10.18.0.jar
            Companion/AdminSuite/target/SimplexAdminSuite-10.18.0-source.zip
            Companion/AdminSuite/target/Simplex-Admin-Recovery.pdf
            Companion/AdminSuite/target/AdminSuite-SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload Geyser bridge extension
        uses: actions/upload-artifact@v4
        with:
          name: SimplexSentinelBridge-geyser-extension
          path: |
            Companion/SentinelBridge/target/SimplexSentinelBridge-1.6.0.jar
            Companion/SentinelBridge/target/SimplexSentinelBridge-1.6.0-source.zip
            Companion/SentinelBridge/target/SentinelBridge-SHA256SUMS.txt
          if-no-files-found: error


  release:
    name: Publish verified app update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, companion]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Panel-unsigned-IPA
          path: build/release
      - uses: actions/download-artifact@v4
        with:
          name: SimplexAdminSuite-unsigned-plugin
          path: build/companion
      - uses: actions/download-artifact@v4
        with:
          name: SimplexSentinelBridge-geyser-extension
          path: build/bridge
      - name: Publish versioned IPA and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          ipa_files=(build/release/**/*-unsigned.ipa)
          test "${#ipa_files[@]}" -eq 1
          test -f "${ipa_files[0]}"
          ipa_name=$(basename "${ipa_files[0]}")
          ipa_version=${ipa_name#Simplex-Panel-}
          ipa_version=${ipa_version%-unsigned.ipa}
          [[ "$ipa_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ipa_directory=$(dirname "${ipa_files[0]}")
          (cd "$ipa_directory" && shasum -a 256 -c SHA256SUMS.txt)
          tag="app-v${ipa_version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This app version already has a release; increment the version before replacing it."
            exit 1
          fi
          cat > build/release/RELEASE-NOTES.md <<'NOTES'
          Simplex Panel 5.11.0 / Admin Suite 10.18.0: simpler pairing – the app checks the address itself, shows an unknown or changed certificate once for confirmation (no typing of fingerprints), accepts publicly valid certificates of a domain without a fingerprint and explains unreachable ports and proxy errors (502) in plain words; old setup links keep working after a server move. Suite: /sas app status as a pairing checklist with a port self-test, /sas app address <IP:Port>, complete setup links without editing the config, unauthenticated /v1/ping. Contains 5.10.0 / 10.17.0, 5.9.0 / 10.16.1. SentinelBridge 1.6.0 unchanged. See UPDATE-5.11.0.md.

          Simplex Panel 5.10.0 / Admin Suite 10.17.0: chat break (/chat) for Java and Bedrock players – mute the public chat for 30 minutes, 3 hours, 24 hours or until turned back on, with a native Java dialog (inventory fallback) and native Floodgate forms with icons and a preview; no chat from players or plugins and no chat sounds, full-name mentions and whispers optional, hints for players who write or mention a muted player (from six letters of the name), English/German by locale; staff manage chat breaks in the app and web panel; fixed Java players joining invisible or staying invisible after vanish; nicer player preference menu with icons, sounds and effects. Includes 5.9.0 / 10.16.1. SentinelBridge 1.6.0 unchanged. See UPDATE-5.10.0.md.

          Simplex Panel 5.9.0 / Admin Suite 10.16.1: fixes every Java player being disconnected when another Java player leaves (the packet guard withheld scoreboard-team joins during the join check and later let the team leave through, which Java clients reject with a protocol error). PowerBot escalation ladder for chat disputes (calm, public and personal warning, one-minute pause for the players involved, deep review with more context and a five-minute pause for whoever keeps escalating), hostile chat detected within seconds, context analysis every 15 messages, live disputes and active pauses with early lifting in app and web; disconnect forensics that looks behind "Disconnected" (who closed the connection, inbound silence, rejoin time, kernel TCP retransmissions, simultaneity, Java-only waves, equal session length, periodic waves), ranked causes per wave, a live network view, network configuration and plugin checks, and automatic AI analysis for unclear or hidden waves. All data stays compatible. SentinelBridge 1.6.0 unchanged. See UPDATE-5.9.0.md.

          Simplex Panel 5.8.0 / Admin Suite 10.15.0: invsee for online and offline players with a second player side by side, moving, stacking and swapping including armor and offhand, lossless item data (shulker contents, enchantments), duplicate-safe commits with backup and rollback, resource-pack aware item textures (chests, banners, beds, heads, shields, animated blocks), item details, a customizable Schnellzentrale in app and web, an AI that finds players by approximate names and summarizes recent behavior, and a fixed rights editor. SentinelBridge 1.6.0 unchanged. See UPDATE-5.8.0.md.

          Simplex Panel 5.7.0 / Admin Suite 10.14.0: Minecraft-style live inventories with moving items between players, Einbehaltungsablage (app, web, /sas ablage), smart restarts only when few players are online, automation rules (in-game day, time, interval, player count, first join), redesigned AI chat with search, pinning and reply animation, and correct clock times in AI answers. SentinelBridge 1.6.0 unchanged. See UPDATE-5.7.0.md.

          Simplex Panel 5.6.0 / Admin Suite 10.13.0: new PowerBot centre with case conversations, highlighted dispute lines, bot replies and reasons, per-player management, strictness levels and editable system prompts; unified player timeline (chat, whispers, actions, combat, items); briefing since the last visit; Shortcuts for PowerBot and the briefing; fixed device sign-out crash. SentinelBridge 1.6.0 unchanged. See UPDATE-5.6.0.md.

          Simplex Panel 5.5.0 / Admin Suite 10.12.0: pre-delivery whisper review, player chat timelines, Minecraft admin activity, report replies, and a Bark subscription center. See UPDATE-5.5.0.md.

          Simplex Panel 5.4.1 / Admin Suite 10.11.1: searchable PowerBot keyword rules and recent server events on the iPhone home screen. See UPDATE-5.4.1.md.

          Simplex Panel 5.4.0 / Admin Suite 10.11.0: PowerBot chat moderation, staff case queue and visual inventory snapshots. See UPDATE-5.4.0.md.

          Simplex Panel 5.3.0 / Admin Suite 10.10.0: Arts Update with live inventory grids, a persistent console archive, game-day schedules, reversible lockdown and optional public chat AI. See UPDATE-5.3.0.md.

          Simplex Panel 5.2.0 / Admin Suite 10.9.0: private assistant chat history, reviewable voice dictation, staff chat entry point and owner-approved player restrictions. See UPDATE-5.2.0.md.

          Simplex Panel 5.1.0 / Admin Suite 10.8.0: permission-aware assistant in iOS, web and Discord, owner-only approval of immutable action plans, and Diagnose 3.0 packet metadata. See UPDATE-5.1.0.md.

          Simplex Panel 5.0.0 / Admin Suite 10.7.0: customization update with saved NBT player information, compact synchronized shortcuts, server visibility, and safer plugin staging and transfers. See UPDATE-5.0.0.md.

          Simplex Panel 4.9.1 (Build 39): app-only fixes for fixed-server shortcuts, selectable server entries, short pinned HTTPS deadlines, cancellation/retry and optional schema loading. Admin Suite 10.6.0 remains compatible and does not need replacing. See UPDATE-4.9.1.md.

          Simplex Panel 4.9.0 / Admin Suite 10.6.0: home shortcuts, a complete searchable Admin tool directory, native iOS Shortcuts for tools and individual advertising places, and app/web history management with confirmation, backup and restore. Existing app identity, credentials, settings and ad timers remain compatible. PR builds upload JAR and IPA artifacts without publishing. See UPDATE-4.9.0.md and Companion/AdminSuite/UPDATE-10.6.0.md for upgrade and rollback.

          Simplex Panel 4.8.0 / Admin Suite 10.5.0: Werbe-Zentrale replaces the Discord self-bot planner – the Discord token login and all automatic posting are removed (stored tokens and their key are deleted on the first start; change the alt account password to invalidate the token at Discord too). Advertising places for Discord channels (channel link opens the channel directly in the Discord iOS app), Reddit, Planet Minecraft, Facebook groups, Telegram, WhatsApp, X and server lists, each with link, ad text and interval; when a place is due, a Bark reminder arrives ("ad-reminder", time-sensitive, repeats until posted) – tapping it copies the text into the iOS clipboard and opens the place, and the timer restarts slightly above the interval (6 h → about 6.1 h); snooze from the app, the web panel or the reminder sheet, undo for a mistaken tap; Bark links are HMAC-bound to one place and cycle and work without login. Formats with platform-style previews and one-tap conversion: Discord markdown, Reddit markdown, BBCode (Planet Minecraft, forums), WhatsApp/Telegram, Facebook Unicode bold and plain text; ready-made Simplex texts for Reddit, Planet Minecraft and Facebook. Existing 10.4.0 texts and channels (with their running timers) are migrated without data loss. Web panel: automatic performance mode for weak computers (no blur/animations/shadows, slower refreshes; Appearance → Performance: auto/on/off), request time limits, one retry for reads after network hiccups or 502/503/504, non-overlapping page refreshes, offline banner and last-resort error handling.

          Simplex Panel 4.7.0 / Admin Suite 10.4.0: Discord advertising planner (replaced in 4.8.0 / 10.5.0 by the Werbe-Zentrale).

          Simplex Panel 4.6.0 / Admin Suite 10.3.0 / SentinelBridge 1.6.0: studio, world trimmer and dossier – Discord status designer (texts, colours, fields, images, bot activity; seven presets, "Simplex Standard" = previous status) and scoreboard designer (colour codes, placeholders, hex gradients; seven presets, standard = previous board) with exact live previews in app and web panel; the world trimmer in app and web panel (dimensions, threshold, countdown, live progress, override decision, recovery) with backup confirmation, typed confirmation and its own right; optional transactional safety copy with automatic restore, integrity check of every changed region file and a watchdog for a hung MCA Selector; searchable player dossier (identity, activity, client, Bedrock device, network, moderation, position, recent chat/actions) filtered by the viewer's rights; Bedrock: Geyser disconnect reason, third-party name, skin geometry engine, Floodgate link; Java: join host, server transfer, resource-pack status; bridge HTTP 422 fixed (identity-less early packets are skipped by the bridge and accepted as deferred by the suite, Floodgate UUID from XUID, no retries on permanent 4xx, throttled warnings), bridge built against Geyser 2.12.1; Bark test notification can always be sent (also during quiet hours and before saving a key); app hub and web navigation regrouped, web quick search (Ctrl/⌘+K). New rights (data.world-trim, world-trim.run, data.discord-status, discord-status.edit, data.scoreboard, scoreboard.edit) are not part of any role template.

          Simplex Panel 4.5.0 / Admin Suite 10.2.0: diagnostics centre – fixes per-player command switches ("Pflichtfeld fehlt: grant"); every disconnect with category (timeout, connection reset, packet error, own quit, kicks …), ping, session length and chunk, console "lost connection" reasons attached; three or more disconnects within seconds or a share of all players become an incident with a verdict (legit / problem: server lag, watchdog, network path Java-only/Bedrock-only, broken item/chunk, anticheat wave) and concrete steps; Bark/browser push as critical or time-sensitive alarm for subscribers (disconnect-wave, crash, lag-spike); short, IP-redacted AI analyses with the existing OpenAI key (automatic for critical incidents and crashes, hourly limit); live TPS/tick/RAM/GC/CPU charts and lag spikes; lag map (entity and block-entity hotspots per chunk with types, nearest player and teleport command, chunk generation per player); spark profiler control and server-side analysis of raw spark profiles (plugins by CPU time with deepest-plugin attribution, hot methods, findings); crash manager (heartbeat + live console mirror: watchdog, OutOfMemoryError, JVM hs_err, tick exceptions, hard kills); full diagnosis with score (incl. DNS, Mojang auth, internet latency); connection history in the player profile; player profiles are saved off the server thread.

          Simplex Panel 4.4.0 / Admin Suite 10.1.0: live switches and command rights – every switch now shows the real state (on = allowed, off = blocked) and saves immediately; fixes the app confirmation bug ("Bestätigung abgelaufen …") that made rank, LuckPerms, Lands and lock changes fail; every server command per player (grouped by kind, plugin or A–Z) can be blocked or allowed live with duration, reason and alt-account inheritance (default on), global blocks for all players, missing rank permissions granted through LuckPerms; rank with prefix/suffix and group assignment in the player profile; LuckPerms node switches and group templates (player, VIP, builder, supporter, moderator, admin); the same in the web panel and the Java/Bedrock menus.

          Simplex Panel 4.3.1 / Admin Suite 10.0.1: rights and locks in one place – the player profile opens one unified view with lock areas (land/wilderness, duration, reason) and every remaining player right (chat, commands, PvP, dimensions, freeze …) blockable for a time or permanently; no double management of chests, doors and co. (existing classic blocks stay valid and are lifted with their area); live player search with autocomplete in app and web panel; the same entry in Java and Bedrock menus.

          Simplex Panel 4.3.0 / Admin Suite 10.0.0: big rights update – per-player access locks (chests, shulker boxes, other containers, ender chests, doors, redstone, workstations, frames, animals, building, foreign valuable items) that block using, breaking, blowing up and hopper draining even in trusted lands; per lock everywhere / own land only / own land and wilderness, temporary or permanent, with the reason and remaining time shown to the player; presets (thief, containers, griefer, lockdown); managed in the app, the web panel, Discord (/rechtesperre) and the Java/Bedrock admin menus (/rechtesperre). LuckPerms: permission autocomplete, prefix/suffix editor with colour palette and live preview for groups and players. Explained app-user rights with role presets, one-time changelog per account, web panel ban sources (Minecraft, IP, LiteBans) fixed and reports with notes.

          Existing API keys, app users, sessions, TLS identity, Bark subscriptions, tickets, admin log and plugin data stay compatible. Replace the JAR and update the app; no reset is required. See UPDATE-4.9.0.md, Companion/AdminSuite/UPDATE-10.6.0.md, UPDATE-4.8.0.md, Companion/AdminSuite/UPDATE-10.5.0.md, UPDATE-4.7.0.md, Companion/AdminSuite/UPDATE-10.4.0.md, UPDATE-4.6.0.md, Companion/AdminSuite/UPDATE-10.3.0.md, Companion/SentinelBridge/CHANGELOG.md, UPDATE-4.5.0.md, Companion/AdminSuite/UPDATE-10.2.0.md, UPDATE-4.4.0.md, UPDATE-4.3.1.md, UPDATE-4.3.0.md, Companion/AdminSuite/UPDATE-10.1.0.md, UPDATE-10.0.1.md and UPDATE-10.0.0.md and docs/Simplex-Admin-Recovery.pdf. This release job only runs after a merge to main; pull requests produce JAR and IPA artifacts without publishing.

          NOTES
          (cd build/companion && sha256sum -c AdminSuite-SHA256SUMS.txt)
          (cd build/bridge && sha256sum -c SentinelBridge-SHA256SUMS.txt)
          gh release create "$tag" build/companion/*.jar build/companion/*-source.zip build/companion/Simplex-Admin-Recovery.pdf build/companion/AdminSuite-SHA256SUMS.txt build/bridge/*.jar build/bridge/*-source.zip build/bridge/SentinelBridge-SHA256SUMS.txt "${ipa_files[0]}" "$ipa_directory/SHA256SUMS.txt" build/release/validation-proof.json --target "$GITHUB_SHA" --title "Simplex Panel ${ipa_version}" --notes-file build/release/RELEASE-NOTES.md --latest


